<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="172" viewBox="0 0 900 172" role="img"><title>about daiana</title><style></style><rect width="900" height="172" fill="#232322"/><text x="40" y="44" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" fill="#ecebe6">my work centers around building <tspan fill="#e8b84a" font-weight="700">systems</tspan> and measuring whether they actually <tspan fill="#e8b84a" font-weight="700">work.</tspan> i</text><text x="40" y="70" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" fill="#ecebe6">study <tspan fill="#e8b84a" font-weight="700">computer science &amp; engineering</tspan> at <tspan fill="#e8b84a" font-weight="700">politehnica university of bucharest</tspan> and i’m</text><text x="40" y="96" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" fill="#ecebe6">interested in the things below.</text><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.4s" fill="freeze"/><rect x="40" y="126" width="159" height="22" fill="none" stroke="#8fc1a5" stroke-opacity="0.55"/><text x="49" y="141" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#8fc1a5">distributed systems</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.55s" dur="0.4s" fill="freeze"/><rect x="209" y="126" width="77" height="22" fill="none" stroke="#8fc1a5" stroke-opacity="0.55"/><text x="218" y="141" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#8fc1a5">security</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.4s" fill="freeze"/><rect x="296" y="126" width="137" height="22" fill="none" stroke="#8fc1a5" stroke-opacity="0.55"/><text x="305" y="141" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#8fc1a5">embedded systems</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.05s" dur="0.4s" fill="freeze"/><rect x="443" y="126" width="144" height="22" fill="none" stroke="#8fc1a5" stroke-opacity="0.55"/><text x="452" y="141" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#8fc1a5">chaos engineering</text></g></svg>